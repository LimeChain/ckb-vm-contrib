[package]
name = "protobuf-ckb-syscalls"
description = "Provides protobuf format for syscalls"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
ckb-vm-fuzzing-utils = { workspace = true, default-features = false }
ckb-vm.workspace = true
ckb-std.workspace = true

prost.workspace = true
spin.workspace = true

# std-only
once_cell = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }

[build-dependencies]
prost-build.workspace = true
prost-reflect-build.workspace = true

[features]
default = ["std", "stub-c-syscalls"]
std = ["once_cell", "prost-reflect", "prost/std", "ckb-vm-fuzzing-utils/std"]
stub-c-syscalls = ["ckb-std/stub-c-syscalls"]
text-format = ["std"]
print-debug-messages = ["std"]
